# Builds the standalone Android release APK on GitHub's Linux machines. No Expo Go, no Metro:
# the JavaScript is bundled into the app. Same build as `npm run apk` (arm64 only), without the
# Windows path problems a local build can hit.
#
# The APK is signed with the React Native template debug key (same as local builds), so it
# installs over an existing Kesefly install.
#
# Download: repo > Releases > "Kesefly Android build N" > Kesefly.apk
# (also repo > Actions > "Android build" > run > Artifacts > Kesefly-android).

name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the APK as a release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JavaScript packages
        run: npm ci

      - name: Generate the Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        working-directory: mobile/android
        run: ./gradlew app:assembleRelease -x lint -x test -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Kesefly.apk
          ls -lh Kesefly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kesefly-android
          path: mobile/Kesefly.apk
          retention-days: 30

      # Public download link that needs no GitHub login. Not marked latest, so the iPhone
      # release link (releases/latest) keeps pointing at the iOS build.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Kesefly Android build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          make_latest: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: mobile/Kesefly.apk
          body: |
            Android release APK (arm64) built from ${{ github.ref_name }} @ ${{ github.sha }}.
            Install: copy to the phone and open it, or `adb install -r Kesefly.apk`.
