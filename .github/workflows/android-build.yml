# Builds the standalone Android release APK on GitHub's Linux machines. No Expo Go, no Metro:
# the JavaScript is bundled into the app. Same build as `npm run apk` (arm64 only), without the
# Windows path problems a local build can hit.
#
# The APK is signed with the React Native template debug key (same as local builds), so it
# installs over an existing Kesefly install.
#
# Download: repo > Releases > "Kesefly Android build N" > Kesefly.apk
# (also repo > Actions > "Android build" > run > Artifacts > Kesefly-android).

name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Only the `release` job below can write (it creates the tag and release),
# and it runs no npm, Gradle or other project code.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JavaScript packages
        run: npm ci

      - name: Tests, typecheck, lint
        run: |
          npm test
          npx tsc --noEmit
          npm run lint

      - name: Generate the Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      # Gradle caches and wrapper between runs (about 20 to 8-10 minutes once warm).
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build release APK (arm64)
        working-directory: mobile/android
        run: ./gradlew app:assembleRelease -x lint -x test -PreactNativeArchitectures=arm64-v8a --build-cache

      - name: Name the APK and write its SHA-256
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Kesefly.apk
          ls -lh Kesefly.apk
          sha256sum Kesefly.apk > Kesefly.apk.sha256
          cat Kesefly.apk.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Kesefly-android
          path: |
            mobile/Kesefly.apk
            mobile/Kesefly.apk.sha256
          if-no-files-found: error
          retention-days: 30

  # Public download link that needs no GitHub login. Not marked latest, so the iPhone
  # release link (releases/latest) keeps pointing at the iOS build.
  # Separate job so that only this job holds `contents: write`: it never checks out or runs
  # project code (no npm ci, no install scripts, no Gradle), it only publishes the APK that
  # the build job uploaded, with its SHA-256 checksum.
  release:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the android-build-N tag and release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Kesefly-android
          path: out

      - name: Verify SHA-256
        working-directory: out
        run: |
          sha256sum -c Kesefly.apk.sha256
          cat Kesefly.apk.sha256

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Kesefly Android build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          make_latest: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: |
            out/Kesefly.apk
            out/Kesefly.apk.sha256
          body: |
            Android release APK (arm64) built from ${{ github.ref_name }} @ ${{ github.sha }}.
            Install: copy to the phone and open it, or `adb install -r Kesefly.apk`.
            Check the download: `sha256sum -c Kesefly.apk.sha256` (file attached to this release).
