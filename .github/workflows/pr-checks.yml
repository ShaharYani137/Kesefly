# Runs the JavaScript checks for the mobile app on every pull request into main:
# unit tests (vitest), typecheck (tsc) and lint. Same commands as the "Tests, typecheck, lint"
# step of android-build.yml, without the native build. Read-only: no secrets, no vars.

name: PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/pr-checks.yml'
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JavaScript packages
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
