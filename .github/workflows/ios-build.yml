# Builds a standalone iPhone app (.ipa) on GitHub's Macs. No Expo Go, no Metro, no computer
# needed at run time: the JavaScript is bundled into the app (Release build).
#
# The .ipa is UNSIGNED. Install it from Windows with Sideloadly and an Apple ID, which
# signs it for your iPhone (free-account apps must be reinstalled every 7 days).
# Steps: docs/INSTALL_IPHONE.md.
#
# Two files per run:
# - Kesefly.ipa            with the home-screen widget (needs an App Group: paid Apple
#                          Developer account)
# - Kesefly-no-widget.ipa  without the widget (KESEFLY_IOS_WIDGET=0, mobile/app.config.js),
#                          for a free Apple ID, which cannot sign App Groups
#
# Download: repo > Actions > "iOS build" > latest run > Artifacts > Kesefly-ios /
# Kesefly-ios-no-widget (main also publishes both as a GitHub Release).

name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main, Shavit, Shahar, feature/day-trading-lab]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the release on main

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: widget
            widget: '1'
            file: Kesefly.ipa
            artifact: Kesefly-ios
          - variant: no-widget
            widget: '0'
            file: Kesefly-no-widget.ipa
            artifact: Kesefly-ios-no-widget
    defaults:
      run:
        working-directory: mobile
    env:
      KESEFLY_IOS_WIDGET: ${{ matrix.widget }}
      # Optional cloud accounts. Set these as repository VARIABLES (Settings > Secrets and
      # variables > Actions > Variables). Empty = accounts stay on the phone (device mode).
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JavaScript packages
        run: npm ci

      - name: Tests, typecheck, lint
        run: |
          npm test
          npx tsc --noEmit
          npm run lint

      - name: Generate the iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: Check entitlements (free Apple ID cannot sign push)
        run: |
          ENT=$(ls ios/*/*.entitlements 2>/dev/null | head -1 || true)
          if [ -n "$ENT" ]; then
            plutil -p "$ENT"
            if /usr/libexec/PlistBuddy -c 'Print :aps-environment' "$ENT" >/dev/null 2>&1; then
              echo "::warning::aps-environment still present; removing it"
              /usr/libexec/PlistBuddy -c 'Delete :aps-environment' "$ENT"
            fi
            if [ "$KESEFLY_IOS_WIDGET" = "0" ] && /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$ENT" >/dev/null 2>&1; then
              echo "::error::no-widget build still has an App Group entitlement"
              exit 1
            fi
          fi
          if [ "$KESEFLY_IOS_WIDGET" = "0" ] && grep -q KeseflyWidget ios/Kesefly.xcodeproj/project.pbxproj; then
            echo "::error::no-widget build still has the widget target"
            exit 1
          fi

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Kesefly.xcworkspace \
            -scheme Kesefly \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E '(error|warning: .*deprecated|BUILD (SUCCEEDED|FAILED))' || true
          test -d build/Build/Products/Release-iphoneos/Kesefly.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Kesefly.app Payload/
          test -f Payload/Kesefly.app/main.jsbundle
          zip -qry "${{ matrix.file }}" Payload
          ls -lh "${{ matrix.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: mobile/${{ matrix.file }}
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ matrix.variant }}
          path: mobile/xcodebuild.log
          if-no-files-found: ignore

  # main only: publish both .ipa files as one GitHub Release, so they have permanent public
  # links that need no GitHub login:
  # https://github.com/ShaharYani137/Kesefly/releases/latest/download/Kesefly.ipa
  # https://github.com/ShaharYani137/Kesefly/releases/latest/download/Kesefly-no-widget.ipa
  release:
    needs: ios
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Kesefly-ios*
          merge-multiple: true
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: Kesefly iPhone build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/Kesefly.ipa
            out/Kesefly-no-widget.ipa
          body: |
            Unsigned iPhone app, two files:
            - Kesefly-no-widget.ipa: for a free Apple ID (no home-screen widget).
            - Kesefly.ipa: with the widget, needs a paid Apple Developer account.
            Install from Windows with Sideloadly; turn on Developer Mode on the iPhone.
            Steps: docs/INSTALL_IPHONE.md.
